name: FluxShop
version: 1.1.0
main: net.fluxmc.fluxshop.FluxShop
api-version: '1.20'
depend: [Vault]
softdepend: [PlayerPoints]
description: Paginated GUI shop with buy and sell support
commands:
  shop:
    description: Open the shop
    usage: /shop [category|reload]
permissions:
  fluxshop.use:
    description: Use the shop
    default: true
  fluxshop.reload:
    description: Reload the shop config
    default: op
